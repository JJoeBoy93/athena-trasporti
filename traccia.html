<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segui la spedizione — Athena Trasporti</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6ec">
<link rel="icon" href="img/icona-32.png" sizes="32x32" type="image/png">
<link rel="preload" href="font/playfair-display.woff2" as="font" type="font/woff2" crossorigin>

<body class="pagina-prenota">
<main class="dentro prenota">
  <a href="./" class="prenota-logo"><picture>
    <source srcset="img/logo.webp" type="image/webp">
    <img src="img/logo.png" width="781" height="503" alt="Athena Trasporti di Ardito Jacopo Joe">
  </picture></a>
  <h1>Segui la spedizione</h1>
  <form id="cerca" class="traccia-cerca">
    <label for="codice" class="prenota-sotto">Il codice della tua spedizione</label>
    <input id="codice" name="c" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AT-XXXXX" maxlength="8" required>
    <button type="submit" class="pulsante pulsante-oro azione-larga">Cerca</button>
  </form>
  <p class="esito" id="stato" role="status" aria-live="polite"></p>
  <section id="risultato" class="prenota-riepilogo" hidden>
    <p class="prenota-sotto" id="titolo"></p>
    <ol class="traccia-passi" id="passi"></ol>
  </section>
  <p class="prenota-nota">Il codice è nel messaggio che ti abbiamo mandato. Qui non compaiono nomi né indirizzi.</p>
  <p class="oppure">Domande? Scrivi o chiama al <a class="collegamento" href="https://wa.me/393775947995">377 594 7995</a>.</p>
</main>
<script src="js/traccia.js" defer></script>
